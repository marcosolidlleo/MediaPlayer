<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Streaming de Video</title>
    <link rel="stylesheet" href="static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="static/app.js" defer></script>
</head>
<body>

    <h1>CloudStream</h1>

    <!-- REPRODUCTOR -->
    <div class="card">
        <h2 id="titulo-actual" class="flush-top">Selecciona un vídeo para reproducir</h2>
        <video id="reproductor" controls></video>
    </div>

    <!-- SUBIDA DE VÍDEOS -->
    <div class="card">
        <h2 class="flush-top">Subir nuevo vídeo</h2>
        <input type="file" id="archivo-video" accept="video/mp4">
        <button id="btn-subir">Subir</button>
        <div id="estado"></div>
    </div>

    <!-- GALERÍA DE VÍDEOS EN AWS S3 -->
    <div class="card">
        <div class="gallery-header">
            <h2>Vídeos disponibles</h2>
            <button id="btn-actualizar">🔄 Actualizar lista</button>
        </div>
        <div id="galeria" class="video-list">Cargando vídeos</div>
    </div>
</body>
</html>
